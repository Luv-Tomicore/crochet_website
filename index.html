<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch-it with Tomi | Handmade Crochet</title>
    <!-- Google Fonts: Pacifico for Script, Quicksand for Rounded Text -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1a2a44;
            --pink: #b57c7c;
            --cream: #fcf9f2;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif; /* Spicy rounded font */
            background-color: var(--cream);
            color: var(--navy);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* --- WELCOME PAGE --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--cream);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .welcome-circle {
            text-align: center;
            border: 4px dashed var(--navy);
            padding: 80px 40px;
            border-radius: 50%;
            background: var(--white);
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            max-width: 450px;
        }

        .welcome-circle h1 {
            font-family: 'Pacifico', cursive; /* Extra spicy script */
            font-size: 3.5rem;
            margin: 0;
            color: var(--pink);
            transform: rotate(-5deg); /* Adds a little character */
        }

        .welcome-circle p {
            font-size: 1.2rem;
            margin: 20px 0 30px 0;
            font-weight: 700;
            color: var(--navy);
        }

        .enter-btn {
            background-color: var(--pink);
            color: var(--white);
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.3rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(181, 124, 124, 0.4);
        }

        .enter-btn:hover {
            background-color: var(--navy);
            transform: scale(1.1) rotate(2deg);
        }

        /* --- MAIN SHOP CONTENT --- */
        #main-shop {
            opacity: 0;
            padding-top: 100px;
            transition: opacity 1s ease;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: var(--white);
            padding: 15px 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 3px dashed var(--pink);
            z-index: 900;
        }

        .logo-text {
            font-family: 'Pacifico', cursive;
            color: var(--pink);
            font-size: 1.8rem;
            margin: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--navy);
            margin: 0 15px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Shop Grid Styles */
        .shop-container {
            max-width: 1200px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 20px;
        }

        .product-card {
            background: var(--white);
            border: 2px dashed var(--navy);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .product-card:hover {
            transform: scale(1.03);
            border-color: var(--pink);
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: #fdf2f2;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
        }

        .product-card h3 { 
            font-family: 'Quicksand', sans-serif;
            font-size: 1.5rem;
            margin: 10px 0; 
        }

        .price {
            color: var(--pink);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .buy-btn {
            background-color: var(--navy);
            color: var(--white);
            border: none;
            padding: 12px 0;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            transition: 0.3s;
        }

        .buy-btn:hover {
            background-color: var(--pink);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen">
        <div class="welcome-circle">
            <h1>Stitch-it <br> with Tomi</h1>
            <p>Spun with Love, Hooked with Style.</p>
            <button class="enter-btn" onclick="enterShop()">Let's Shop! ✨</button>
        </div>
    </div>

    <!-- MAIN SHOP -->
    <div id="main-shop">
        <header>
            <p class="logo-text">Stitch-it with Tomi</p>
            <nav>
                <a href="#">Gallery</a>
                <a href="#">Shop</a>
                <a href="#">Cart (0)</a>
            </nav>
        </header>

        <section class="shop-container">
            <div class="product-card">
                <div class="product-image">🧶 [Photo Here]</div>
                <h3>Bubblegum Beanie</h3>
                <p class="price">$25.00</p>
                <button class="buy-btn">Grab it!</button>
            </div>

            <div class="product-card">
                <div class="product-image">🧸 [Photo Here]</div>
                <h3>Snuggle Bear</h3>
                <p class="price">$35.00</p>
                <button class="buy-btn">Grab it!</button>
            </div>

            <div class="product-card">
                <div class="product-image">🎒 [Photo Here]</div>
                <h3>Market Tote</h3>
                <p class="price">$45.00</p>
                <button class="buy-btn">Grab it!</button>
            </div>
        </section>
    </div>

    <script>
        function enterShop() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.visibility = 'hidden';
                document.getElementById('main-shop').style.opacity = '1';
            }, 800);
        }
    </script>
</body>
</html>
